<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tulsi AI</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">

            <div class="card-header">
                <h3 class="mb-0">Tulsi AI</h3>
            </div>

            <div class="card-body">

                <div class="mb-3">

                    <div class="mb-3">
                        <strong>Tulsi:</strong>
                        <p>Hey! I am Tulsi. How can I help you?</p>
                    </div>

                    {% if response %}
                        <div class="mb-3">
                            <strong>You:</strong>
                            <p>{{ user_message }}</p>
                        </div>

                        <div class="mb-3">
                            <strong>Tulsi:</strong>
                            <p>{{ response }}</p>
                        </div>
                    {% endif %}

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="input-group">
                        <input
                            type="text"
                            name="message"
                            class="form-control"
                            placeholder="Type your message..."
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Send
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</body>
</html>
